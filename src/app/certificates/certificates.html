<section>
    <h2>Certificates</h2>
    <ul>
        @for (cert of certificates$ | async; track cert.nombre) {
        <li>
            @if (cert.url) {
            <a [href]="cert.url" target="_blank" rel="noopener noreferrer">{{cert.nombre}}</a>
            } @else {
            {{cert.nombre}}
            }
            by {{cert.emisor}} ({{cert.fecha}})
        </li>
        }
    </ul>
</section>
